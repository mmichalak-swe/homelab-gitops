networks:
  caddy-net:
    name: caddy-net
    external: true

services:
  drawio:
    cap_drop:
      - ALL
    container_name: drawio
    dns: 172.19.0.2
    deploy:
      resources:
        limits:
          memory: 256M
    expose:
      - 8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    hostname: drawio
    image: ghcr.io/mmichalak-swe/homelab-gitops/drawio:31.1.5-alpine-custom@sha256:8fd754d638079fc144f0cf7ce06be7727790e8511deb4c1fb286620b1b6ea2c1
    networks:
      caddy-net:
        ipv4_address: 172.19.0.22
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run:rw,noexec,nosuid,nodev,size=16m
      - /usr/local/tomcat/temp:rw,noexec,nosuid,nodev,size=64m
      - /usr/local/tomcat/work:rw,noexec,nosuid,nodev,size=128m
      - /usr/local/tomcat/logs:rw,noexec,nosuid,nodev,size=32m
