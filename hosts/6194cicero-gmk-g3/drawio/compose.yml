networks:
  caddy-net:
    name: caddy-net
    external: true

services:
  drawio:
    cap_drop:
      - ALL
    container_name: drawio
    dns: 172.19.0.2
    deploy:
      resources:
        limits:
          memory: 256M
    expose:
      - 8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    hostname: drawio
    image: ghcr.io/mmichalak-swe/homelab-gitops/drawio:32.3.0-alpine-custom@sha256:7a60afd3b7b8dee8998928dd18a4a66189d6634d8acc7a43a6d7c3e3965f1d10
    networks:
      caddy-net:
        ipv4_address: 172.19.0.22
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
