networks:
  beszel-net:
    driver: bridge
    ipam:
      config:
        - gateway: 172.19.1.1
          ip_range: 172.19.1.0/25
          subnet: 172.19.1.0/25
    name: beszel_net
  caddy-net:
    external: true
    name: caddy-net
  socket-proxy-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - gateway: 172.19.1.129
          ip_range: 172.19.1.128/25
          subnet: 172.19.1.128/25
    name: beszel_socket_proxy_net

services:
  beszel:
    cap_drop:
      - ALL
    container_name: beszel
    deploy:
      resources:
        limits:
          memory: 256M
    dns: 172.19.0.2
    environment:
      - APP_URL=${APP_URL}
    expose:
      - 8090
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    hostname: beszel
    image: henrygd/beszel:0.19.0@sha256:fefb27166f5e1611ebf67f8697ea928a23f44efdb00af922e2ac3b5faa2efd5c
    networks:
      beszel-net:
      caddy-net:
        ipv4_address: 172.19.0.25
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
    user: "1100:1100"
    volumes:
      - data:/beszel_data

  beszel-agent:
    cap_drop:
      - ALL
    container_name: beszel-agent
    depends_on:
      beszel:
        condition: service_healthy
      beszel-socket-proxy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      - DISABLE_SSH=true
      - DOCKER_HOST=tcp://beszel-socket-proxy:2375
      - HUB_URL=http://beszel:8090
      - KEY=${KEY}
      - TOKEN=${TOKEN}
    hostname: beszel-agent
    image: henrygd/beszel-agent:0.18.8@sha256:3b1939746690e423072b4a99bf4c4af6dd9562a68978a33738a3c4a4cc000c39
    networks:
      beszel-net:
      socket-proxy-net:
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
    user: "1100:1100"
    volumes:
      - agent-data:/var/lib/beszel-agent

  beszel-socket-proxy:
    cap_drop:
      - ALL
    container_name: beszel-socket-proxy
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      - ALLOW_LOGS=0
      - ALLOW_PAUSE=0
      - ALLOW_RESTARTS=0
      - ALLOW_START=0
      - ALLOW_STOP=0
      - ALLOW_UNPAUSE=0
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1
      - DISABLE_IPV6=0
      - DISTRIBUTION=0
      - EVENTS=0
      - EXEC=0
      - IMAGES=0
      - INFO=1
      - LOG_LEVEL=info
      - NETWORKS=0
      - NODES=0
      - PING=0
      - PLUGINS=0
      - POST=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SOCKET_PATH=/var/run/docker.sock
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - TZ=${TZ}
      - VERSION=1
      - VOLUMES=0
    expose:
      - 2375
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --no-verbose http://localhost:2375/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    hostname: beszel-socket-proxy
    image: linuxserver/socket-proxy:3.4.4@sha256:cba12c42b1df30a6446856028f5ab726e9d8921f1ea74be509216c5e41357d42
    networks:
      socket-proxy-net:
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:exec
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  data:
  agent-data:
