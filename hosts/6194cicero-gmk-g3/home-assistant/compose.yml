networks:
  caddy-net:
    name: caddy-net
    external: true
  home-assistant-net:
    driver: macvlan
    driver_opts:
      parent: enp3s0
    ipam:
      config:
        - gateway: ${HA_LAN_GATEWAY}
          subnet: ${HA_LAN_SUBNET}
    name: home-assistant-net

services:
  home-assistant:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    container_name: home-assistant
    deploy:
      resources:
        limits:
          memory: 2G
    dns: 172.19.0.2
    environment:
      - TZ=${TZ}
    expose:
      - 8123
    hostname: home-assistant
    image: linuxserver/homeassistant:2026.8.3@sha256:e87d92ac0b818cdd7e57ea118b129cfcef2c795b3dcaff557d185404fec2af83
    networks:
      caddy-net:
        ipv4_address: 172.19.0.30
      home-assistant-net:
        gw_priority: 1
        ipv4_address: ${HA_LAN_IP}
        mac_address: ${HA_LAN_MAC}
    read_only: false
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,exec,nosuid,nodev
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
      - config:/config

volumes:
  config:
