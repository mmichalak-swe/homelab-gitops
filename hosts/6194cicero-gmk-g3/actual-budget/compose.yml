networks:
  caddy-net:
    name: caddy-net
    external: true

services:
  actual_server:
    cap_drop:
      - ALL
    container_name: actual-server
    dns: 172.19.0.2
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - ACTUAL_OPENID_AUTH_METHOD=${ACTUAL_OPENID_AUTH_METHOD}
      - ACTUAL_OPENID_CLIENT_ID=${ACTUAL_OPENID_CLIENT_ID}
      - ACTUAL_OPENID_CLIENT_SECRET=${ACTUAL_OPENID_CLIENT_SECRET}
      - ACTUAL_OPENID_DISCOVERY_URL=${ACTUAL_OPENID_DISCOVERY_URL}
      - ACTUAL_OPENID_SERVER_HOSTNAME=${ACTUAL_OPENID_SERVER_HOSTNAME}
    expose:
      - 5006
    healthcheck:
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    hostname: actual-server
    image: actualbudget/actual-server:26.10.0-alpine@sha256:67b1b5e9584e3e143b4f5c41e52b4506ed9cdd1072392d5ab5369f2d4fd0bffd
    networks:
      caddy-net:
        ipv4_address: 172.19.0.23
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    user: "1001:1001"
    volumes:
      - data:/data

volumes:
  data:
