networks:
  caddy-net:
    driver: bridge
    ipam:
      config:
        - gateway: 172.19.0.1
          ip_range: 172.19.0.0/24
          subnet: 172.19.0.0/24
    name: caddy-net

services:
  caddy:
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    container_name: caddy
    dns: 172.19.0.2
    environment:
      - PORKBUN_API_KEY=${PORKBUN_API_KEY}
      - PORKBUN_API_SECRET_KEY=${PORKBUN_API_SECRET_KEY}
    expose:
      - 80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    hostname: caddy
    image: ghcr.io/mmichalak-swe/homelab-gitops/caddy:2.11.9-alpine-custom-porkbun@sha256:85e770832490f667c32bdd88fff1a588e6635e6350d96021b28ecefb00b35022
    networks:
      caddy-net:
        ipv4_address: 172.19.0.5
    ports:
      - '443:443'
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run:rw,noexec,nosuid,nodev,size=16m
    user: "1000:1000"
    volumes:
      - conf:/etc/caddy:ro
      - config:/config
      - data:/data
      - site:/srv:ro

volumes:
  conf:
  config:
  data:
  site:
