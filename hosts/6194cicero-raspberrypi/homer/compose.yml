networks:
  caddy-net:
    name: caddy-net
    external: true

services:
  homer:
    cap_drop:
      - ALL
    container_name: homer
    deploy:
      resources:
        limits:
          memory: 64M
    dns: 172.18.0.2
    environment:
      - INIT_ASSETS=${INIT_ASSETS}
    expose:
      - 8080
    hostname: homer
    image: b4bz/homer:v26.08.3@sha256:febc8967c9f7648ec37633ef3ae1ec90dbe8b7c46fecab80299f08f05be7ecb6
    networks:
      caddy-net:
        ipv4_address: 172.18.0.23
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev
      - /run:mode=0755,nosuid,nodev
      - /var/run:mode=0755,nosuid,nodev
    user: "1000:1000"
    volumes:
      - assets:/www/assets

volumes:
  assets:
