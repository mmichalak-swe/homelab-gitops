networks:
  caddy-net:
    name: caddy-net
    external: true

services:
  vaultwarden:
    cap_drop:
      - ALL
    container_name: vaultwarden
    deploy:
      resources:
        limits:
          memory: 256M
    dns: 172.18.0.2
    environment:
      - DOMAIN=${DOMAIN}
    expose:
      - 80
    hostname: vaultwarden
    image: vaultwarden/server:1.37.4-alpine@sha256:19ea2b669945d842dadc3d500f2d6a795866a003330f59a47b9634658bae98bb
    networks:
      caddy-net:
        ipv4_address: 172.18.0.21
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
      - /var/run
    user: "1000:1000"
    volumes:
      - data:/data/

volumes:
  data:
